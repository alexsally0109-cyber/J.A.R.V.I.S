<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b"><meta name="description" content="JARVIS Full Edition – persönlicher KI-Agent mit HUD, Erinnerungen, Memory und Capability Manager">
<link rel="manifest" href="manifest.webmanifest">
<title>J.A.R.V.I.S. — Full Edition</title>
<style>
:root{--c:#5be8ff;--c2:#158ca8;--bg:#02070b;--panel:rgba(4,17,23,.78);--line:rgba(91,232,255,.24);--text:#e5fbff;--muted:#79a9b2;--ok:#7dffb2;--warn:#ffd37d;--danger:#ff8d8d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#02070b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}button,input,textarea,select{font:inherit}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(20,102,123,.18),transparent 35%),linear-gradient(rgba(91,232,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(91,232,255,.025) 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;pointer-events:none}
.app{width:100%;height:100%;position:relative}.hud{position:absolute;inset:18px;border:1px solid var(--line);border-radius:28px;background:rgba(1,7,11,.74);box-shadow:inset 0 0 80px rgba(91,232,255,.035),0 0 60px rgba(91,232,255,.05);backdrop-filter:blur(10px);overflow:hidden}
.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(91,232,255,.12)}.brand{letter-spacing:6px;font-weight:700}.status{font-size:11px;letter-spacing:3px;color:var(--c)}.header-actions{display:flex;gap:8px}.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:rgba(5,31,40,.5);color:var(--text);border-radius:10px;cursor:pointer}
.content{height:calc(100% - 64px);display:grid;grid-template-columns:240px 1fr 290px;gap:16px;padding:16px}.left,.right{display:flex;flex-direction:column;gap:12px;min-width:0}.card{background:var(--panel);border:1px solid rgba(91,232,255,.14);border-radius:18px;padding:14px}.card h3{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 12px}.metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(91,232,255,.07);font-size:12px}.metric:last-child{border-bottom:0}.metric b{color:var(--c);font-weight:500}.main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;position:relative}.core{width:min(340px,46vw);aspect-ratio:1;position:relative;display:grid;place-items:center}.ring{position:absolute;border-radius:50%;border:1px solid rgba(91,232,255,.45);box-shadow:0 0 30px rgba(91,232,255,.06)}.r1{inset:0;animation:spin 20s linear infinite}.r2{inset:16%;border-style:dashed;animation:spin 13s linear reverse infinite}.r3{inset:31%;border-color:rgba(91,232,255,.75);animation:spin 7s linear infinite}.r4{inset:42%;border-width:2px;box-shadow:0 0 45px rgba(91,232,255,.35)}.orb{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#f2ffff 0,#5be8ff 15%,#087b99 42%,transparent 70%);box-shadow:0 0 50px rgba(91,232,255,.55);animation:pulse 2.4s ease-in-out infinite}.state{position:absolute;bottom:-26px;font-size:11px;letter-spacing:4px;color:var(--c)}.reply{max-width:680px;text-align:center;margin-top:36px;color:#c9edf2;font-size:15px;line-height:1.55;min-height:48px}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(5,30,38,.4);color:#bfeef5;cursor:pointer;font-size:11px}
.log{height:190px;overflow:auto;font-size:10px;line-height:1.45;color:#8fb5bc}.log div{padding:5px 0;border-bottom:1px solid rgba(91,232,255,.05)}.log .user{color:#bdebf2}.log .jarvis{color:var(--c)}.log .system{color:var(--warn)}
.composer{position:absolute;left:calc(240px + 32px);right:calc(290px + 32px);bottom:24px;display:flex;gap:8px}.composer input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(2,14,19,.9);color:var(--text);outline:none}.btn{border:1px solid var(--line);background:rgba(7,38,48,.72);color:var(--text);padding:12px 15px;border-radius:12px;cursor:pointer}.btn:hover,.pill:hover,.iconbtn:hover{border-color:var(--c);box-shadow:0 0 18px rgba(91,232,255,.12)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:20}.modal{width:min(760px,92vw);max-height:86vh;overflow:auto;background:#061118;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 0 70px rgba(0,0,0,.6)}.modal h2{margin-top:0;letter-spacing:2px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(91,232,255,.09)}.row small{color:var(--muted)}.field{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#031017;color:white}.cap{border:1px solid rgba(91,232,255,.14);border-radius:14px;padding:12px;margin:8px 0}.cap strong{color:var(--c)}.cap .tag{font-size:9px;color:var(--muted);letter-spacing:1px}.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.2)}}
@media(max-width:900px){.content{grid-template-columns:1fr}.left,.right{display:none}.main{padding-bottom:80px}.composer{left:30px;right:30px}.hud{inset:8px}.core{width:min(300px,70vw)}}
</style>
</head>
<body>
<div class="app"><div class="hud">
<div class="header"><div class="brand">J.A.R.V.I.S.</div><div class="status" id="status">STANDBY</div><div class="header-actions"><button class="iconbtn" id="mic" title="Voice">◉</button><button class="iconbtn" id="settings" title="Settings">⚙</button></div></div>
<div class="content">
<aside class="left">
<div class="card"><h3>SYSTEM</h3><div class="metric"><span>VOICE</span><b id="voiceState">READY</b></div><div class="metric"><span>MEMORY</span><b id="memoryCount">0</b></div><div class="metric"><span>REMINDERS</span><b id="reminderCount">0</b></div><div class="metric"><span>CAPABILITIES</span><b id="capCount">0</b></div><div class="metric"><span>KUNDEN</span><b id="customerCount">0</b></div><div class="metric"><span>VERSION</span><b>FULL 1.0</b></div></div>
<div class="card"><h3>CUSTOMER CRM</h3><div id="customerPreview" style="color:var(--muted);font-size:11px">Keine Kunden gespeichert.</div></div><div class="card"><h3>ACTIVE TASKS</h3><div id="tasks"><div style="color:var(--muted);font-size:11px">Keine aktiven Aufgaben.</div></div></div>
</aside>
<main class="main"><div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="orb"></div><div class="state" id="coreState">STANDBY</div></div><div class="reply" id="reply">Guten Tag, Sir. Ich bin bereit.</div><div class="quick"><button class="pill" data-cmd="Was habe ich heute noch vor?">Tagesplan</button><button class="pill" data-cmd="Zeig mir meine Erinnerungen">Erinnerungen</button><button class="pill" data-cmd="Welche Fähigkeiten hast du?">Capabilities</button><button class="pill" data-cmd="Kundenverwaltung öffnen">Kunden</button><button class="pill" data-cmd="Öffne Google">Google</button></div></main>
<aside class="right"><div class="card"><h3>ACTIVITY</h3><div class="log" id="log"></div></div><div class="card"><h3>REMINDER ENGINE</h3><div id="nextReminder" style="font-size:12px;color:var(--muted)">Keine Erinnerung geplant.</div></div></aside>
</div>
<div class="composer"><input id="input" autocomplete="off" placeholder="Sprechen Sie normal mit JARVIS …"><button class="btn" id="send">SEND</button><button class="btn" id="voiceBtn">VOICE</button></div>
</div></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const KEY={mem:'jarvis.memories',rem:'jarvis.reminders',caps:'jarvis.capabilities',prefs:'jarvis.prefs',audit:'jarvis.audit'};
const CRM_KEY='jarvis.customers'; const SYNC_KEY='jarvis.sync';
const baseCaps=[
{id:'web',name:'Web Research',desc:'Live-Websuche und Quellenvergleich',risk:'low',installed:true},
{id:'memory',name:'Long-term Memory',desc:'Lokale Präferenzen und Notizen',risk:'low',installed:true},
{id:'reminders',name:'Reminder Engine',desc:'Einmalige und wiederkehrende Check-ins',risk:'low',installed:true},
{id:'calendar',name:'Calendar',desc:'Termine lesen und erstellen',risk:'medium',installed:false},
{id:'computer',name:'Computer Use',desc:'Bildschirm verstehen und Maus/Tastatur steuern',risk:'high',installed:false},
{id:'mail',name:'Email',desc:'E-Mails lesen, entwerfen und senden',risk:'high',installed:false},
{id:'smart-home',name:'Smart Home',desc:'Geräte und Szenen steuern',risk:'medium',installed:false}
];
const $=id=>document.getElementById(id); const memStore={}; const storage={get(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=String(v)}}}; const load=(k,d)=>{try{return JSON.parse(storage.get(k)||JSON.stringify(d))}catch(e){return d}}; const save=(k,v)=>storage.set(k,JSON.stringify(v));
let caps=load(KEY.caps,baseCaps); let reminders=load(KEY.rem,[]); let memories=load(KEY.mem,[]); let audit=load(KEY.audit,[]); let customers=load(CRM_KEY,[]); let syncCfg=load(SYNC_KEY,{endpoint:'',deviceId:'device-'+Math.random().toString(16).slice(2),lastSync:null});
function log(type,msg){audit.unshift({t:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),type,msg});audit=audit.slice(0,80);save(KEY.audit,audit);renderLog()}
function renderLog(){$('log').innerHTML=audit.slice(0,14).map(x=>`<div class="${x.type}"><b>${x.t}</b> ${esc(x.msg)}</div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setState(s){$('status').textContent=s.toUpperCase();$('coreState').textContent=s.toUpperCase()}
function refresh(){ $('memoryCount').textContent=memories.length; $('customerCount').textContent=customers.length; $('customerPreview').innerHTML=customers.length?customers.slice(0,3).map(c=>`<div style="padding:5px 0;border-bottom:1px solid rgba(91,232,255,.06)"><b>${esc(c.name)}</b><br><span style="color:var(--muted)">${esc(c.email||c.phone||'Keine Kontaktdaten')}</span></div>`).join(''):'Keine Kunden gespeichert.'; $('reminderCount').textContent=reminders.filter(r=>!r.done).length; $('capCount').textContent=caps.filter(c=>c.installed).length; renderLog(); renderReminder(); }
function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.97;u.pitch=.96;u.onstart=()=>{$('voiceState').textContent='SPEAKING'};u.onend=()=>{$('voiceState').textContent='READY';setState('standby')};speechSynthesis.speak(u)}
function respond(text){$('reply').textContent=text;log('jarvis',text);setState('speaking');speak(text);setTimeout(()=>setState('standby'),1800)}
function findMissing(input){const l=input.toLowerCase(); if(l.includes('kalender')||l.includes('termin'))return 'calendar'; if(l.includes('computer')||l.includes('bildschirm')||l.includes('klick')||l.includes('öffne')&&l.includes('programm'))return 'computer'; if(l.includes('mail')||l.includes('e-mail')||l.includes('email'))return 'mail'; if(l.includes('licht')||l.includes('smart home')||l.includes('lampe'))return 'smart-home'; return null;}
function openCRM(){
  $('modal').innerHTML=`<h2>KUNDENVERWALTUNG</h2><p style="color:var(--muted)">Kunden werden lokal auf diesem Gerät gespeichert. Für geräteübergreifende Synchronisierung kann später ein sicherer JARVIS-Sync-Endpunkt hinterlegt werden.</p>
  <div style="display:grid;gap:8px"><input id="cName" class="field" placeholder="Name / Firma"><input id="cEmail" class="field" placeholder="E-Mail"><input id="cPhone" class="field" placeholder="Telefon"><textarea id="cNote" class="field" placeholder="Notiz"></textarea><button class="btn" onclick="addCustomer()">KUNDEN ANLEGEN</button></div>
  <div style="margin-top:18px">${customers.length?customers.map(c=>`<div class="cap"><strong>${esc(c.name)}</strong><div>${esc(c.email||'')} ${esc(c.phone||'')}</div><div style="color:var(--muted);font-size:11px">${esc(c.note||'')}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="prepareMail('${c.id}')">MAIL VORBEREITEN</button><button class="btn" onclick="customerCalendar('${c.id}')">KALENDER</button></div></div>`).join(''):'<div style="color:var(--muted)">Noch keine Kunden.</div>'}</div><div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeModal()">SCHLIESSEN</button></div>`;
  $('overlay').style.display='flex';
}
function addCustomer(){const name=$('cName').value.trim(); if(!name)return respond('Bitte nennen Sie mir mindestens den Namen des Kunden, Sir.'); customers.push({id:'c-'+Date.now(),name,email:$('cEmail').value.trim(),phone:$('cPhone').value.trim(),note:$('cNote').value.trim(),createdAt:Date.now()}); save(CRM_KEY,customers); log('system','Kunde angelegt: '+name); refresh(); openCRM();}
function prepareMail(id){const c=customers.find(x=>x.id===id); if(!c)return; const body=`Guten Tag ${c.name},\n\n[Hier Ihre Nachricht einfügen]\n\nViele Grüße`; navigator.clipboard?.writeText(body).catch(()=>{}); respond(`Ich habe einen E-Mail-Entwurf für ${c.name} vorbereitet. In der mobilen Web-App wird er noch nicht automatisch versendet.`);}
function customerCalendar(id){const c=customers.find(x=>x.id===id); if(!c)return; nativeOpen('https://calendar.google.com/calendar/u/0/r/eventedit?text='+encodeURIComponent('Termin mit '+c.name),`Ich habe den Kalender für ${c.name} geöffnet, Sir.`);}
function syncInfo(){respond(syncCfg.endpoint?`Synchronisierung ist für ${syncCfg.endpoint} konfiguriert. Ein sicherer Sync-Server muss noch verbunden werden.`:'Die Geräte-Synchronisierung ist vorbereitet, Sir. Hinterlegen Sie später einen sicheren JARVIS-Sync-Endpunkt.');}
async function handle(text){text=text.trim();if(!text)return;log('user',text);setState('thinking');
const l=text.toLowerCase();
if(l.includes('kundenverwaltung')||l.includes('kunden anlegen')||l.includes('kundenliste')||l==='kunden')return openCRM();
if(l.includes('synchron')||l.includes('geräte verbinden'))return syncInfo();
if(l.includes('google')){return nativeOpen('https://www.google.com','Google ist geöffnet, Sir.')}
if(l.includes('youtube')){return nativeOpen('https://www.youtube.com','YouTube ist geöffnet, Sir.')}
if(l.includes('kalender')){return nativeOpen('https://calendar.google.com','Ihr Kalender ist geöffnet, Sir.')}
if(l.includes('mail')||l.includes('e-mail')||l.includes('email')){return nativeOpen('https://mail.google.com','Ihr Mail-Postfach ist geöffnet, Sir.')}
if(l.includes('word')){return nativeLaunch('word','Microsoft Word wird geöffnet, Sir.')}
if(l.includes('chrome')){return nativeLaunch('chrome','Chrome wird geöffnet, Sir.')}
if(l.includes('edge')){return nativeLaunch('edge','Edge wird geöffnet, Sir.')}
if(l.includes('welcher')&&l.includes('version')||l.includes('welche version'))return respond('Sie verwenden JARVIS Full Edition 2.3.0. Capability Discovery durchsucht das offene Web über mehrere Suchindizes; ein produktiver App-Update-Server ist bewusst nicht konfiguriert.');
if(l.includes('fähigkeiten')||l.includes('was kannst du'))return respond(`Aktiv sind ${caps.filter(c=>c.installed).map(c=>c.name).join(', ')}. Nicht installiert sind ${caps.filter(c=>!c.installed).map(c=>c.name).join(', ')}.`);
if(l.includes('erinner')||l.includes('jeden abend')||l.includes('morgen'))return reminderIntent(text);
if(l.includes('memory')||l.includes('merk dir')||l.includes('merke dir')){memories.push({text:text.replace(/.*?(merk dir|merke dir)/i,'').trim(),t:Date.now()});save(KEY.mem,memories);refresh();return respond('Verstanden, Sir. Ich habe das in meiner lokalen Memory gespeichert.');}
if(l.includes('reminder')||l.includes('erinnerungen')){return respond(reminders.length?`Sie haben ${reminders.length} gespeicherte Erinnerungen.`:'Aktuell sind keine Erinnerungen gespeichert.');}
const missing=findMissing(text); if(missing&&!caps.find(c=>c.id===missing)?.installed)return capabilityPrompt(missing);
if(l.includes('update')||l.includes('verbessere dich')){return respond('Produktive App-Auto-Updates sind deaktiviert. Ich kann fehlende Fähigkeiten jedoch erkennen, Quellen recherchieren und Ihnen die Installation einzelner Capabilities zur Freigabe vorlegen.')}
if(l.includes('suche')||l.includes('recherch')||l.includes('finde')||l.includes('was brauche ich')){return discoverWeb(text)} 
return respond(`Verstanden, Sir. Für diese Aufgabe fehlt mir noch ein passendes Tool. Ich kann die fehlende Capability erkennen und Ihnen deren Installation zur Freigabe vorlegen.`);
}
async function discoverWeb(text){try{if(window.jarvisNative?.capabilityDiscover){const r=await window.jarvisNative.capabilityDiscover(text);log('system',`Capability Discovery: ${r.resultCount || 0} Web-Treffer über ${r.engineCount || 0} Suchindizes gesammelt.`);const first=r.searchUrls[0];await nativeOpen(first,`Ich durchsuche das offene Web über mehrere Suchindizes, Sir. Treffer sind nicht automatisch vertrauenswürdig; eine Installation benötigt Ihre Freigabe.`);return;}return nativeOpen('https://www.google.com/search?q='+encodeURIComponent(text), 'Ich starte eine Webrecherche, Sir.')}catch(e){return respond('Die Webrecherche konnte nicht gestartet werden: '+e.message)}}
function reminderIntent(text){const now=new Date();let m=text.match(/(heute|morgen)?\s*(?:um\s*)?(\d{1,2})(?::(\d{2}))?\s*uhr/i); if(!m)return respond('Gern, Sir. Nennen Sie mir bitte die Uhrzeit, zum Beispiel: „Erinnere mich heute um 18 Uhr daran, meine Aufgaben zu prüfen.“');let h=+m[2],min=+(m[3]||0);let d=new Date(now);if(/morgen/i.test(text))d.setDate(d.getDate()+1);d.setHours(h,min,0,0);if(d<=now)d.setDate(d.getDate()+1);let content=text.replace(/.*?\d{1,2}(?::\d{2})?\s*uhr/i,'').replace(/^(daran|dass|zu)\s*/i,'').trim()||'Ihre Aufgabe';let r={id:(crypto.randomUUID?crypto.randomUUID():('r-'+Date.now()+'-'+Math.random().toString(16).slice(2))),when:d.toISOString(),text:content,done:false,interactive:true};reminders.push(r);save(KEY.rem,reminders);refresh();return respond(`Erledigt, Sir. Ich erinnere Sie am ${d.toLocaleString('de-DE')} und warte auf Ihre Antwort.`)}
async function nativeOpen(url,msg){try{if(window.jarvisNative?.openUrl)await window.jarvisNative.openUrl(url);else window.open(url,'_blank');return respond(msg)}catch(e){return respond('Das Öffnen ist fehlgeschlagen: '+e.message)}}
async function nativeLaunch(name,msg){try{if(!window.jarvisNative?.launch)throw new Error('Native Edition nicht aktiv');await window.jarvisNative.launch(name);return respond(msg)}catch(e){return respond('Das Programm konnte nicht gestartet werden: '+e.message)}}
function capabilityPrompt(id){const c=caps.find(x=>x.id===id); if(!c)return respond('Diese Fähigkeit konnte ich noch nicht klassifizieren.'); $('modal').innerHTML=`<h2>CAPABILITY ERKANNT</h2><p>Sir, diese Fähigkeit ist noch nicht installiert:</p><div class="cap"><strong>${c.name}</strong><div>${c.desc}</div><div class="tag">RISIKO: ${c.risk.toUpperCase()}</div></div><p style="color:var(--muted)">JARVIS durchsucht jetzt das offene Web nach passenden Erweiterungen. Ich zeige Ihnen einen Kandidaten und frage vor dem Download. Nach Ihrer Freigabe wird nur ein verifiziertes Capability-Paket mit HTTPS + SHA-256 übernommen.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">ABBRECHEN</button><button class="btn" onclick="installCap('${id}')">INSTALLATION FREIGEBEN</button></div>`;$('overlay').style.display='flex';}
async function installCap(id){const c=caps.find(x=>x.id===id);if(!c)return;try{if(window.jarvisNative?.capabilityInstall){const manifest=window.JARVIS_CAPABILITY_MANIFESTS?.[id];if(!manifest)throw new Error('Für diese Capability ist noch kein verifiziertes Release-Manifest hinterlegt.');await window.jarvisNative.capabilityInstall(manifest);log('system',`${c.name} heruntergeladen, SHA-256 geprüft und registriert.`);}else{log('system',`${c.name} lokal als Capability registriert; native Installer nicht verfügbar.`)}c.installed=true;save(KEY.caps,caps);closeModal();refresh();respond(`${c.name} wurde nach Ihrer Freigabe registriert, Sir.`)}catch(e){log('system',`Installation abgebrochen: ${e.message}`);respond('Ich habe die Installation aus Sicherheitsgründen nicht aktiviert: '+e.message)}}
function renderReminder(){let pending=reminders.filter(r=>!r.done).sort((a,b)=>new Date(a.when)-new Date(b.when));$('nextReminder').textContent=pending.length?`${pending[0].text} — ${new Date(pending[0].when).toLocaleString('de-DE')}`:'Keine Erinnerung geplant.'}
function checkReminders(){const now=Date.now();for(const r of reminders){if(!r.done&&new Date(r.when).getTime()<=now){r.done=true;save(KEY.rem,reminders);refresh();log('system','Reminder ausgelöst: '+r.text);interactiveReminder(r)}}}
function interactiveReminder(r){setState('listening');$('reply').textContent=`Sir, sind Sie da? ${r.text}`;speak(`Sir, sind Sie da? ${r.text}`); if('Notification'in window&&Notification.permission==='granted')new Notification('JARVIS',{body:`Sir, sind Sie da? ${r.text}`});}
function openSettings(){ $('modal').innerHTML=`<h2>JARVIS SETTINGS</h2><div class="row"><div><b>Wake Word</b><br><small>Aktuell: Hey JARVIS</small></div><button class="btn" onclick="alert('Wake-Word Engine wird in der nativen Full Edition angeschlossen.')">KONFIGURIEREN</button></div><div class="row"><div><b>Notifications</b><br><small>Interaktive Erinnerungen</small></div><button class="btn" onclick="requestNotif()">FREIGEBEN</button></div><div class="row"><div><b>Capabilities</b><br><small>Fehlende Fähigkeiten entdecken und freigeben</small></div><button class="btn" onclick="openCaps()">VERWALTEN</button></div><div class="row"><div><b>Updates</b><br><small>Keine produktiven App-Auto-Updates</small></div><button class="btn" onclick="respond('Richtig: Es gibt keinen produktiven Update-Server. Fehlende Capabilities können weiterhin nach Freigabe recherchiert und installiert werden.')">PRÜFEN</button></div><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">SCHLIESSEN</button></div>`;$('overlay').style.display='flex';}
function openCaps(){ $('modal').innerHTML=`<h2>CAPABILITY CENTER</h2>${caps.map(c=>`<div class="cap"><strong>${c.name}</strong> ${c.installed?'✓':'○'}<div>${c.desc}</div><div class="tag">RISK ${c.risk.toUpperCase()}</div>${!c.installed?`<button class="btn" style="margin-top:8px" onclick="installCap('${c.id}')">FREIGEBEN</button>`:''}</div>`).join('')}<div style="text-align:right"><button class="btn" onclick="closeModal()">SCHLIESSEN</button></div>`;$('overlay').style.display='flex';}
function requestNotif(){if('Notification'in window)Notification.requestPermission().then(()=>respond('Benachrichtigungen sind eingerichtet, Sir.'))}
function closeModal(){$('overlay').style.display='none'}
$('send').onclick=()=>{const t=$('input').value;$('input').value='';handle(t)};$('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('settings').onclick=openSettings;$('mic').onclick=$('voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return respond('Die Sprachaufnahme ist in diesem Browser nicht verfügbar. Nutzen Sie Chrome/Edge oder die native Full Edition.');const r=new SR();r.lang='de-DE';r.interimResults=false;r.onstart=()=>{setState('listening');$('voiceState').textContent='LISTENING'};r.onresult=e=>handle(e.results[0][0].transcript);r.onerror=()=>{setState('standby');$('voiceState').textContent='READY'};r.onend=()=>{$('voiceState').textContent='READY'};r.start()};document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>handle(b.dataset.cmd));
window.installCap=installCap;window.closeModal=closeModal;window.openCaps=openCaps;window.requestNotif=requestNotif;window.openCRM=openCRM;window.addCustomer=addCustomer;window.prepareMail=prepareMail;window.customerCalendar=customerCalendar;setInterval(checkReminders,1000);refresh();log('system','JARVIS Full Edition gestartet.');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
